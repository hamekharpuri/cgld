<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Welcome Aboard</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    padding:50px;
    background:#f5f5f5;
}

.card{
    max-width:600px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<div class="card">

<h1>Welcome Aboard!</h1>

<h2 id="name">Student</h2>

<p><strong>Department:</strong>
<span id="department"></span></p>

<p><strong>Hostel:</strong>
<span id="hostel"></span></p>

</div>

<script>

const students = {

"2026001":{
name:"John Samuel",
department:"Theology",
hostel:"Joshua House"
},

"2026002":{
name:"David Paul",
department:"Missions",
hostel:"Caleb House"
}

};

const params = new URLSearchParams(window.location.search);

const id = params.get("id");

if(students[id]){

document.getElementById("name").innerText =
students[id].name;

document.getElementById("department").innerText =
students[id].department;

document.getElementById("hostel").innerText =
students[id].hostel;

}

</script>

</body>
</html>
